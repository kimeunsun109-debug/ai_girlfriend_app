<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PickMeTalk — 우리의 추억</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 0 auto; background: #faf8f6; color: #333; }
    header { background: linear-gradient(135deg, #ff6b9d, #c44569); color: white; padding: 1.5rem 1rem; text-align: center; }
    header h1 { margin: 0; font-size: 1.4rem; }
    nav { display: flex; background: white; border-bottom: 1px solid #eee; overflow-x: auto; }
    nav button { flex: 1; padding: 0.75rem 0.5rem; border: none; background: none; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
    nav button.active { color: #c44569; border-bottom: 2px solid #c44569; font-weight: 600; }
    main { padding: 1rem; min-height: 60vh; }
    .timeline-item { background: white; border-radius: 12px; padding: 1rem; margin-bottom: 0.75rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .timeline-date { font-size: 0.75rem; color: #999; margin-bottom: 0.25rem; }
    .timeline-title { font-weight: 600; }
    .timeline-emoji { font-size: 1.5rem; float: right; }
    .timeline-desc { font-size: 0.85rem; color: #666; margin-top: 0.25rem; }
    .divider { border: none; border-top: 1px dashed #eee; margin: 0.5rem 0; }
    .album-cat { margin-bottom: 1.5rem; }
    .album-cat h3 { font-size: 0.95rem; margin: 0 0 0.5rem; }
    .album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .album-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
    .journey-stage { background: white; border-radius: 12px; padding: 1rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.75rem; }
    .journey-stage.locked { opacity: 0.4; }
    .journey-stage.current { border: 2px solid #c44569; }
    .stage-num { width: 32px; height: 32px; border-radius: 50%; background: #ffe0eb; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #c44569; flex-shrink: 0; }
    .ann-item { display: flex; justify-content: space-between; padding: 0.75rem; background: white; border-radius: 8px; margin-bottom: 0.5rem; }
    .empty { text-align: center; color: #999; padding: 2rem; }
    .setup { background: white; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; }
    .setup input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; border: 1px solid #ddd; border-radius: 6px; }
    .setup button { width: 100%; padding: 0.6rem; background: #c44569; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>❤️ 우리의 추억</h1>
    <p id="subtitle" style="margin:0.25rem 0 0; opacity:0.9; font-size:0.85rem"></p>
  </header>

  <div class="setup" id="setup">
    <label>userCharacterId</label>
    <input id="ucId" placeholder="시드 후 표시되는 ID 입력" />
    <button onclick="saveAndLoad()">불러오기</button>
  </div>

  <nav>
    <button class="active" data-tab="timeline" onclick="switchTab('timeline')">📅 Timeline</button>
    <button data-tab="album" onclick="switchTab('album')">📷 Album</button>
    <button data-tab="anniversary" onclick="switchTab('anniversary')">🎂 Anniversary</button>
    <button data-tab="journey" onclick="switchTab('journey')">💕 Journey</button>
  </nav>

  <main id="content"></main>

  <script>
    let ucId = localStorage.getItem('pickme_ucId') || '';
    if (ucId) document.getElementById('ucId').value = ucId;

    function saveAndLoad() {
      ucId = document.getElementById('ucId').value.trim();
      localStorage.setItem('pickme_ucId', ucId);
      loadTab('timeline');
    }

    function switchTab(tab) {
      document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      loadTab(tab);
    }

    async function loadTab(tab) {
      const el = document.getElementById('content');
      if (!ucId) { el.innerHTML = '<p class="empty">userCharacterId를 입력하세요</p>'; return; }

      try {
        if (tab === 'timeline') await loadTimeline(el);
        else if (tab === 'album') await loadAlbum(el);
        else if (tab === 'anniversary') await loadAnniversary(el);
        else if (tab === 'journey') await loadJourney(el);
      } catch (e) {
        el.innerHTML = `<p class="empty">오류: ${e.message}</p>`;
      }
    }

    async function loadTimeline(el) {
      const res = await fetch(`/api/timeline?userCharacterId=${ucId}`);
      const data = await res.json();
      document.getElementById('subtitle').textContent = data.characterName ? `${data.characterName}와(과) 함께` : '';

      if (!data.items?.length) {
        el.innerHTML = '<p class="empty">아직 추억이 없어요</p>';
        return;
      }

      el.innerHTML = data.items.map(item => `
        <div class="timeline-item">
          <span class="timeline-emoji">${item.emoji || '✨'}</span>
          <div class="timeline-date">${formatDate(item.occurredAt)}</div>
          <div class="timeline-title">${item.title}</div>
          ${item.description ? `<div class="timeline-desc">${item.description}</div>` : ''}
          ${item.photoUrl ? `<img src="${item.photoUrl}" style="width:100%;border-radius:8px;margin-top:0.5rem" />` : ''}
        </div>
        <hr class="divider" />
      `).join('');
    }

    async function loadAlbum(el) {
      const res = await fetch(`/api/album?userCharacterId=${ucId}`);
      const data = await res.json();
      if (!data.categories?.length) {
        el.innerHTML = '<p class="empty">앨범이 비어있어요</p>';
        return;
      }
      el.innerHTML = data.categories.map(cat => `
        <div class="album-cat">
          <h3>${cat.label} (${cat.count})</h3>
          <div class="album-grid">
            ${cat.photos.map(p => `<img src="${p.photoUrl}" title="${p.title || ''}" />`).join('')}
          </div>
        </div>
      `).join('');
    }

    async function loadAnniversary(el) {
      const res = await fetch(`/api/anniversary?userCharacterId=${ucId}`);
      const data = await res.json();
      el.innerHTML = data.anniversaries.map(a => `
        <div class="ann-item">
          <span>${a.emoji || '🎉'} ${a.label}</span>
          <span style="color:${a.isCelebrated ? '#c44569' : '#999'}">${a.isCelebrated ? '✓ 축하함' : `D-${a.daysUntil}`}</span>
        </div>
      `).join('');
    }

    async function loadJourney(el) {
      const res = await fetch(`/api/journey?userCharacterId=${ucId}`);
      const data = await res.json();
      document.getElementById('subtitle').textContent =
        `Lv${data.currentStage?.level} ${data.currentStage?.name} · ${data.daysTogether}일째`;

      el.innerHTML = `
        <div style="background:white;border-radius:12px;padding:1rem;margin-bottom:1rem;text-align:center">
          <div style="font-size:2rem">${data.affectionScore?.toFixed(0)}</div>
          <div style="color:#999;font-size:0.85rem">호감도</div>
        </div>
        ${(data.allStages || []).map(s => `
          <div class="journey-stage ${s.isCurrent ? 'current' : ''} ${s.isUnlocked ? '' : 'locked'}">
            <div class="stage-num">${s.level}</div>
            <div>
              <div style="font-weight:600">${s.name}</div>
              <div style="font-size:0.75rem;color:#999">${s.rewards.map(r => r.label).join(' · ') || '기본 대화'}</div>
            </div>
          </div>
        `).join('')}
      `;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    if (ucId) loadTab('timeline');
  </script>
</body>
</html>
